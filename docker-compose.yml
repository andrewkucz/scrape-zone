# Production deployment (e.g. Dokploy "Compose" app pointing at this repo).
#
#   BETTER_AUTH_SECRET=... BETTER_AUTH_URL=https://... docker compose up -d --build
#   docker compose exec app node server/create-user.ts <email> <password> [name]
#
# No host ports are published: the app listens on 3000 inside the compose
# network and a reverse proxy (Dokploy's Traefik, via a domain on the `app`
# service, port 3000) terminates TLS in front of it. Set USER_EMAILS to a
# comma-separated allowlist to permit account creation at /signup or via CLI.
name: scrape-zone

services:
  app:
    # The whole workspace is the build context: the app consumes scrape-ts
    # from packages/scrape-ts.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${APP_IMAGE:-scrape-zone:latest}
    environment:
      PORT: 3000
      # Set in Dokploy's Environment tab (or a .env next to this file).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # The public https URL; better-auth checks request origins against it.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      # Empty or unset blocks signups. Recreate the container after changing.
      USER_EMAILS: ${USER_EMAILS:-}
    volumes:
      # Accounts and sessions (SQLite).
      - auth-data:/app/data
    expose:
      - "3000"
    # Chromium uses /dev/shm heavily; Docker's 64 MB default crashes pages.
    shm_size: 1gb
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  auth-data:
